name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build, migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustchain
          POSTGRES_PASSWORD: trustchain
          POSTGRES_DB: trustchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustchain -d trustchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://trustchain:trustchain@localhost:5432/trustchain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build shared config
        run: npm run build -w @trustchain/config

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w @trustchain/database

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Build backend
        run: npm run build -w @trustchain/backend

      - name: Run Prisma migrations
        run: npm run migrate:up

      - name: Seed roles
        run: npm run db:seed

      - name: Wave 1 unit checks
        run: npm run test:unit -w @trustchain/backend

      - name: Build web
        run: npm run build -w @trustchain/web

      - name: Build extension
        run: npm run build -w @trustchain/extension

      - name: Compile blockchain
        run: npm run compile -w @trustchain/blockchain
