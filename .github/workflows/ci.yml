name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build shared config
        run: npm run build -w @trustchain/config

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Build backend
        run: npm run build -w @trustchain/backend

      - name: Build web
        run: npm run build -w @trustchain/web

      - name: Build extension
        run: npm run build -w @trustchain/extension

      - name: Compile blockchain
        run: npm run compile -w @trustchain/blockchain
