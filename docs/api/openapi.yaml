openapi: 3.0.3
info:
  title: "TrustChain Public API"
  description: "External TrustChain developer API. Authenticate with an organization API key (`Authorization: Bearer tc_live_***` or `tc_test_***`)."
  version: 0.1.0
  contact:
    name: "TrustChain Developer Platform"
  license:
    name: Proprietary
servers:
  - url: https://api.trustchain.local/api/public/v1
    description: "Public API v1"
tags:
  - name: Health
    description: "Service health"
  - name: Usage
    description: "API usage metrics"
  - name: Documents
    description: "Document metadata"
  - name: Certificates
    description: "Certificate issuance & retrieval"
  - name: Signatures
    description: "Digital signatures"
security:
  - ApiKeyBearer:
      []
paths:
  /health:
    get:
      tags:
        - Health
      summary: "Health check"
      operationId: getHealth
      responses:
        200:
          description: OK
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  version:
                    type: string
                  organizationId:
                    type: string
                    format: uuid
                  authType:
                    type: string
                    enum:
                      - api_key
                      - service_account
                  requestId:
                    type: string
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
  /usage:
    get:
      tags:
        - Usage
      summary: "Usage metrics"
      operationId: getUsage
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        200:
          description: "Usage metrics and recent requests"
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: object
                  requests:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        403:
          description: "Insufficient scope"
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
  /documents:
    post:
      tags:
        - Documents
      summary: "Create document"
      operationId: createDocument
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                description:
                  type: string
                  maxLength: 5000
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      organizationId:
                        type: string
                        format: uuid
                      title:
                        type: string
                      description:
                        type: string
                        nullable: true
                      status:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
  /documents/{id}:
    get:
      tags:
        - Documents
      summary: "Get document"
      operationId: getDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      organizationId:
                        type: string
                        format: uuid
                      title:
                        type: string
                      description:
                        type: string
                        nullable: true
                      status:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        404:
          description: "Not found"
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
  /certificates:
    post:
      tags:
        - Certificates
      summary: "Issue certificate"
      operationId: createCertificate
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - recipientName
              properties:
                title:
                  type: string
                recipientName:
                  type: string
                description:
                  type: string
                  nullable: true
                recipientEmail:
                  type: string
                  format: email
                  nullable: true
                documentId:
                  type: string
                  format: uuid
                  nullable: true
                templateId:
                  type: string
                  format: uuid
                  nullable: true
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate:
                    type: object
  /certificates/{id}:
    get:
      tags:
        - Certificates
      summary: "Get certificate"
      operationId: getCertificate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Certificate
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate:
                    type: object
  /signatures:
    post:
      tags:
        - Signatures
      summary: "Create signature"
      operationId: createSignature
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId:
                  type: string
                  format: uuid
                  nullable: true
                certificateId:
                  type: string
                  format: uuid
                  nullable: true
                algorithm:
                  type: string
                contentHash:
                  type: string
                  nullable: true
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature:
                    type: object
                  generatedPrivateKeyPem:
                    type: string
  /signatures/{id}:
    get:
      tags:
        - Signatures
      summary: "Get signature"
      operationId: getSignature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature:
                    type: object
components:
  securitySchemes:
    ApiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: "API key"
      description: "Organization API key (`tc_live_…` / `tc_test_…`) or service-account secret (`sa_sec_…`)."
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
    RequestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
        format: uuid
