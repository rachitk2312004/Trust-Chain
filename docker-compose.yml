services:
  postgres:
    image: postgres:16-alpine
    container_name: trustchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustchain}
      POSTGRES_DB: ${POSTGRES_DB:-trustchain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trustchain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustchain} -d ${POSTGRES_DB:-trustchain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: trustchain-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - trustchain_minio:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: trustchain-mailhog
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  trustchain_pgdata:
  trustchain_minio:
